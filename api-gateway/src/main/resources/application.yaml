spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: movie-service
              uri: lb://movie-service
              predicates:
                - Path=/api/v1/movies/**
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
